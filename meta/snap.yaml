apps:
  ftl:
    command: bin/service.ftl.sh
    daemon: simple
    start-timeout: 600s
    restart-delay: 10s
    plugs:
    - network
    - network-bind
    restart-condition: always
    before: [nginx]
  nginx:
    user: pihole
    command: bin/service.nginx.sh
    daemon: simple
    plugs:
    - network
    - network-bind
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s
  gravity:
    command: bin/gravity
    daemon: oneshot
    timer: sun,03:00
    plugs:
    - network

  cli:
    command: bin/pihole

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

confinement: strict
description: Network-wide Ad Blocking
grade: stable
name: pihole
summary: Pi-hole
