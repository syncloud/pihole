apps:
  ftl:
    #user: pihole
    command: bin/service.ftl.sh
    daemon: simple
    start-timeout: 600s
    plugs:
    - network
    - network-bind
    restart-condition: always
    before: [nginx]
  nginx:
    user: pihole
    command: bin/service.nginx.sh
    daemon: simple
    plugs:
    - network
    - network-bind
    restart-condition: always
    start-timeout: 600s
  gravity:
    command: bin/gravity
    daemon: oneshot
    timer: sun,03:00
    plugs:
    - network

  cli:
    command: bin/pihole

  sqlite:
    command: sqlite/bin/sqlite.sh

confinement: strict
description: Network-wide Ad Blocking
grade: stable
name: pihole
summary: Pi-hole
layout:
  /etc/pihole:
    bind: $SNAP_DATA/etc/pihole
  /var/log/pihole:
    bind: $SNAP_COMMON/log/pihole
