apps:
  ftl:
    command: bin/service.ftl.sh
    daemon: simple
    start-timeout: 600s
    restart-delay: 10s
    restart-condition: always
    before: [nginx]

  nginx:
    command: bin/service.nginx.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s

  cli:
    command: bin/pihole.sh

  gravity:
    command: bin/service.gravity.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    after: [ftl]

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start

description: Network-wide Ad Blocking
grade: stable
name: pihole
summary: Pi-hole
